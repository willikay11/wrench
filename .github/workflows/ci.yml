name: CI

on:
  push:
    branches: [main, qa]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web — lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - name: Run frontend tests
        working-directory: apps/web
        run: npm run test:run
      - run: npm run build
        env:
          # Sentinels, not credentials. The build only needs the vars to exist;
          # the step below then greps the client bundle for this exact string.
          GOOGLE_CLIENT_ID: ci-sentinel-client-id
          GOOGLE_CLIENT_SECRET: ci-sentinel-client-secret
      # A stray NEXT_PUBLIC_ prefix, or a client component importing the
      # server-side OAuth module, would publish the secret to every visitor
      # and break no other check.
      - name: Assert the OAuth client secret never reaches the browser
        run: |
          if grep -rqF "ci-sentinel-client-secret" .next/static; then
            echo "::error::GOOGLE_CLIENT_SECRET is present in the client bundle"
            exit 1
          fi

  api:
    name: API — lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      # v2.6.2 is built with go1.24 and refuses to lint a module targeting
      # go 1.25.0 ("the Go language version used to build golangci-lint is
      # lower than the targeted Go version"). Keep this at or above the Go
      # version in apps/api/go.mod.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.1
          working-directory: apps/api
      - run: go test ./...
      - run: go build -o bin/api ./cmd/api
        env:
          PORT: 8080
