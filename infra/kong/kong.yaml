# infra/kong/kong.yaml
#
# This file is a TEMPLATE. Kong does not expand ${VAR} in declarative config —
# placeholders reach the parser as literal text, which is why an unrendered
# copy fails with "in 'host': required field missing". docker-entrypoint.sh
# renders it with envsubst before Kong ever reads it.
#
# Required environment variables:
#   WRENCH_API_URL  full URL of the API service, e.g. http://api.railway.internal:8080
#   REDIS_HOST      hostname ONLY, e.g. redis.railway.internal — not a redis:// URL
#   REDIS_PORT      optional, defaults to 6379
#   REDIS_PASSWORD  Redis password

_format_version: "3.0"
_transform: true

services:
  - name: wrench-api
    url: "${WRENCH_API_URL}"
    connect_timeout: 10000
    read_timeout: 60000
    write_timeout: 60000

    routes:
      # Channel-token protected — key-auth is scoped to this route below.
      - name: api-routes
        paths:
          - /v1
        strip_path: false
        preserve_host: false
        protocols:
          - http

      # Deliberately unauthenticated: uptime monitoring and any external
      # prober must reach it without holding a credential.
      - name: health-route
        paths:
          - /health
        strip_path: false
        preserve_host: false
        protocols:
          - http

  # Answered by Kong itself via request-termination below, so it stays up
  # even when the API is down. Railway's healthcheck points here: it should
  # report on the gateway being deployed, not on its upstream.
  - name: kong-health
    url: http://localhost:8000
    routes:
      - name: kong-health-route
        paths:
          - /kong-health
        strip_path: false
        protocols:
          - http

# The channel token per ADR-008. One consumer for now — the Next.js frontend.
# Adding a second consumer later (a mobile client, a partner) is another entry
# here with its own key, which makes revocation per-client.
consumers:
  - username: wrench-web
    keyauth_credentials:
      - key: "${CHANNEL_TOKEN}"

plugins:
  - name: key-auth
    route: api-routes
    config:
      key_names:
        - X-Channel-Token
      # Header only. Kong accepts the key in the query string by default,
      # which would write it into access logs, browser history and Referer
      # headers on every request.
      key_in_header: true
      key_in_query: false
      key_in_body: false
      # Strip the header before proxying — the Go API has no use for it and
      # it should not appear in upstream logs.
      hide_credentials: true

  - name: request-termination
    route: kong-health-route
    config:
      status_code: 200
      content_type: application/json
      body: '{"status":"ok","gateway":"kong"}'

  - name: rate-limiting
    config:
      hour: 1000
      # Per client IP, per ADR-008's "coarse, perimeter" split. Not
      # limit_by: consumer — there is one consumer (wrench-web) for the whole
      # frontend, so that would be a single bucket shared by every visitor.
      # Per-user limits need to know the user, which Kong deliberately does
      # not: see ADR-008 "Rate limiting split".
      limit_by: ip
      policy: redis
      # Kong 3.4+ nests these under `redis` rather than the old redis_* keys.
      # With policy: redis, Kong's entity-level check requires a valid
      # redis.host — an unrendered placeholder here fails that check and
      # surfaces as "failed conditional validation given value of field
      # 'config.policy'".
      redis:
        host: "${REDIS_HOST}"
        port: ${REDIS_PORT}
        username: default
        password: "${REDIS_PASSWORD}"
      hide_client_headers: true
      fault_tolerant: true

  - name: cors
    config:
      origins:
        - https://wrench.it.com
        - https://staging.wrench.it.com
        - http://localhost:3000
      methods:
        - GET
        - POST
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
        - X-Channel-Token
        - X-Request-ID
      credentials: true
      max_age: 3600

  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true

  - name: request-size-limiting
    config:
      allowed_payload_size: 10
      size_unit: megabytes